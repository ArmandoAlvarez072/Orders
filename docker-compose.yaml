services:
  postgres:
    image: postgres:16-alpine
    container_name: orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5434:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql/data

volumes:
  orders_pg_data: