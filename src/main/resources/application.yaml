spring:
  application:
    name: Orders

  datasource:
    url: jdbc:postgresql://localhost:5434/orders_db
    username: ${DB_USERNAME:orders_user}
    password: ${DB_PASSWORD:orders_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:d79024ad-f1f3-44a2-8651-769694f6fa31}
    expiration-ms: 1800000
